roles_add_help = Un role est un modele de specialiste. Remplissez le nom, la description, ainsi que Prompt (qui est le role et comment il repond) et Skill (regles ou etapes concretes). Touchez le bloc Prompt ou Skill pour ouvrir l editeur .md.
roles_save_first = Enregistrez d'abord le nom et la description du rôle, puis ajoutez le prompt et le skill.
part_help = Sur cet écran vous composez l'équipe de la réunion. Remplissez les slots de haut en bas et touchez « Enregistrer ».

    [b]Slots[/b]
    1–4 — participants à la discussion, 5 — Orchestrateur (mène les tours et synthétise les autres), 6 — Secrétaire (gère les documents du projet et rédige le protocole). Un Orchestrateur plus un participant suffisent pour une réunion.

    [b]Rôle[/b]
    Le bouton « Rôle » ouvre la liste des rôles — 23 fournis d'origine, les vôtres se créent dans l'éditeur de rôles. Le crayon à côté permet l'édition rapide du rôle choisi. Les rôles spécialistes conviennent aux participants ; les rôles de conduite (Modérateur, Arbitre, Analyste, etc.) à l'Orchestrateur.

    [b]Modèle[/b]
    « Choisir un modèle » — une liste au format « Fournisseur · Modèle » (G — Google, Nv — NVIDIA, OR — OpenRouter). Un modèle ne peut occuper qu'un seul slot ; seuls les modèles des fournisseurs activés avec clé sont disponibles.

    [b]Prompt[/b]
    Le compteur indique la taille du prompt système du rôle. Touchez pour voir et modifier — les changements s'appliquent à ce slot.

    [b]Docs[/b]
    Documents personnels du participant : un tap ouvre la sélection dans le pool du projet (jusqu'à 5 fichiers par slot). Un participant ne voit que ses propres documents ; le Secrétaire travaille automatiquement avec tout le pool.

    [b]Images[/b]
    En développement.

    [b]Recherche web[/b]
    Le globe dans la ligne du slot (et dans les onglets de réunion) active la recherche web pour ce participant — fonctionne avec les fournisseurs qui la prennent en charge.
# Claud --- Довідка домашнього екрана ---
home_help_title = À propos de l'app
home_help_body = [b]Molfar System[/b] est un espace où plusieurs IA dialoguent au sein d'un même projet en se complétant : chaque participant a son propre modèle, son rôle et ses documents, et l'Orchestrateur mène la discussion.

    Site du projet : [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref] — actualités, guides et prompts & skills supplémentaires pour vos rôles.

    [b]Réunions (projets)[/b]
    Créez un projet et remplissez les slots : 1–4 — participants, 5 — Orchestrateur (mène les tours et synthétise), 6 — Secrétaire (tient la base de connaissances et rédige le protocole). Chaque slot a son modèle, son rôle et ses documents personnels. Vous interrogez l'Orchestrateur, le tour est envoyé à tous, les réponses arrivent dans les onglets.

    [b]Haiduk[/b]
    Un chat individuel rapide avec un seul modèle. Il peut "revêtir" n'importe quel rôle avec skill et prompt, accepte jusqu'à 5 documents et sait faire de la recherche web (si le fournisseur le permet). "Vider le chat" ne supprime que les messages ; changer de rôle réinitialise tout, documents compris.

    [b]Rôles[/b]
    Le rôle définit le comportement de l'IA (prompt) et des règles concrètes (skill). Fournis d'origine — 23 rôles : 17 participants et 6 orchestrateurs. Créez les vôtres dans l'éditeur ; des prompts et skills prêts à l'emploi sont sur notre site.

    [b]Mémoire et documents[/b]
    Chaque slot ne voit que ses propres documents. Les gros fichiers sont indexés par le Secrétaire dans la base de connaissances et servis par fragments — les réunions fonctionnent même avec des documents volumineux.

    [b]Exports et protocoles[/b]
    Chaque onglet s'exporte en fichier texte (dossier Download/Molfar…), et le Secrétaire rédige sur demande un protocole de réunion avec la liste des participants et la chronologie.

    [b]Premiers pas[/b]
    Menu > « Paramètres IA » > saisissez la clé API d'au moins un fournisseur. Les clés sont gratuites et restent uniquement sur votre appareil.

