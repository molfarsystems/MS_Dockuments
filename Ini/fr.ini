# == AI DISCLAIMER (Claud Phase 2.1 — consentement au premier lancement)
disclaimer_title = Avertissement important
disclaimer_accept = J'ai compris
disclaimer_body = [b]Molfar System[/b] est une application de réunions avec IA. Les réponses et les synthèses sont générées par des modèles d'intelligence artificielle tiers (Google Gemini, NVIDIA, OpenRouter).

    [b]L'IA peut se tromper.[/b] Un modèle peut inventer un fait, une source ou un chiffre et l'affirmer avec assurance. Tous les résultats sont fournis à titre informatif — vérifiez vous-même ce qui est important.

    [b]Ceci n'est pas un conseil professionnel.[/b] L'application ne fournit aucun conseil médical, psychologique, juridique ou financier. Les rôles des participants (comme « Psychologue » ou « Conseiller en investissement ») ne sont qu'un style de réponse du modèle, pas le travail d'un spécialiste.

