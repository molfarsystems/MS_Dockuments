ai_settings_help_title = Paramètres IA
ai_settings_help_body = [b]Ici vous connectez les modèles d'IA.[/b] Un seul fournisseur suffit, mais avec plusieurs la réunion est plus variée.

    [b]1. Clé API[/b] — collez la clé dans le champ et touchez l'icône disquette. Le fournisseur s'active automatiquement et son catalogue de modèles devient disponible.

    [b]2. Interrupteur[/b] (en haut à droite de la carte) — active/désactive temporairement le fournisseur ; la clé est conservée. Impossible d'activer sans clé.

    [b]3. Modèles[/b] — la liste des modèles du fournisseur : ajout des vôtres (« + »), édition, activation de chacun séparément. Un modèle désactivé disparaît des sélecteurs dans les chats.

    [b]4. Test[/b] — vérifie la connexion au fournisseur avec la clé actuelle.

    [b]Où obtenir des clés gratuites[/b]
    Google (Gemini) : [ref=https://aistudio.google.com/apikey][color=4db6ac][u]aistudio.google.com/apikey[/u][/color][/ref] — « Create API key », un compte Google est requis.
    NVIDIA (NIM) : [ref=https://build.nvidia.com][color=4db6ac][u]build.nvidia.com[/u][/color][/ref] — inscription, puis « Get API Key » sur la page de n'importe quel modèle.
    OpenRouter : [ref=https://openrouter.ai/keys][color=4db6ac][u]openrouter.ai/keys[/u][/color][/ref] — « Create Key » ; les modèles marqués « :free » sont gratuits.

    Les clés sont stockées localement sur cet appareil en clair et ne sont envoyées qu'aux fournisseurs eux-mêmes.
