md_editor_replace_confirm = Remplacer le texte actuel par le fichier chargé ? Les modifications non enregistrées seront perdues.
md_editor_replace_btn = Remplacer
md_editor_help_prompt = [b]De quoi s'agit-il[/b]
    Vous éditez le prompt système du rôle — le fichier prompt.md. Le prompt définit QUI est le rôle : métier, caractère, style de réponse. Exemple : « Tu es un juriste expérimenté, tu réponds formellement et cites les articles de loi. »

    [b]Comment remplir[/b]
    Saisissez à la main ou chargez un texte prêt via l'icône dossier (.txt et .md uniquement — p. ex. les prompts de notre site). Le chargement remplace le contenu du champ — en cas de modifications non enregistrées, l'éditeur demandera d'abord.

    [b]Enregistrement[/b]
    « Enregistrer » écrit le texte dans le prompt.md de ce rôle — le nom du fichier source n'a pas d'importance. Limite de 5000 caractères : au-delà, le compteur rougit et l'enregistrement est bloqué jusqu'au raccourcissement. La croix ou « Retour » avec des modifications non enregistrées demandera : enregistrer, quitter sans enregistrer ou rester.

    [b]Conseil[/b]
    Le prompt, c'est « qui je suis » ; le skill, « comment je travaille » (règles et étapes concrètes). Ne les dupliquez pas.
md_editor_help_skill = [b]De quoi s'agit-il[/b]
    Vous éditez le skill du rôle — le fichier skill.md. Un skill, ce sont des règles, étapes et modèles de travail concrets. Exemple : « Pour rédiger un contrat : 1) parties ; 2) objet ; 3) conditions ; 4) responsabilité. »

    [b]Comment remplir[/b]
    À la main ou depuis un fichier via l'icône dossier (.txt/.md uniquement). Le chargement remplace le contenu du champ — en cas de modifications non enregistrées, l'éditeur demandera d'abord.

    [b]Enregistrement[/b]
    « Enregistrer » écrit dans le skill.md du rôle — le nom du fichier source est ignoré. Limite de 5000 caractères : au-delà, le compteur rougit et l'enregistrement est bloqué. La croix ou « Retour » avec des modifications non enregistrées demandera : enregistrer / ne pas enregistrer / annuler.

    [b]Pour les orchestrateurs[/b]
    Le skill d'un orchestrateur s'empile PAR-DESSUS les règles fixes du poste d'Orchestrateur — n'écrivez que des compléments (style d'animation, critères), sans répéter la mécanique des tours.
