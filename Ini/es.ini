roles_add_help = Un rol es una plantilla de especialista. Completa el nombre, la descripcion, ademas de Prompt (quien es y como responde) y Skill (reglas o pasos concretos). Toca el bloque Prompt o Skill para abrir el editor .md.
roles_save_first = Guarda primero el nombre y la descripción del rol, luego añade el prompt y el skill.
part_help = En esta pantalla formas el equipo de la reunión. Rellena los slots de arriba abajo y toca "Guardar".

    [b]Slots[/b]
    1–4 — participantes de la discusión, 5 — Orquestador (dirige las rondas y resume a los demás), 6 — Secretario (gestiona los documentos del proyecto y redacta el protocolo). Para una reunión basta el Orquestador y un participante.

    [b]Rol[/b]
    El botón "Rol" abre la lista de roles — 23 de fábrica; los propios se crean en el editor de roles. El lápiz al lado es la edición rápida del rol elegido. A los participantes les van roles especialistas; al Orquestador, roles de conducción (Moderador, Árbitro, Analista, etc.).

    [b]Modelo[/b]
    "Elegir modelo" — una lista en formato "Proveedor · Modelo" (G — Google, Nv — NVIDIA, OR — OpenRouter). Un modelo solo puede ocupar un slot; solo están disponibles los modelos de proveedores activados con clave.

    [b]Prompt[/b]
    El contador muestra el tamaño del prompt de sistema del rol. Tócalo para ver y editar — los cambios se aplican a este slot.

    [b]Docs[/b]
    Documentos personales del participante: al tocar se abre la selección del pool del proyecto (hasta 5 archivos por slot). Un participante ve solo sus documentos; el Secretario trabaja automáticamente con todo el pool.

    [b]Imágenes[/b]
    En desarrollo.

    [b]Búsqueda web[/b]
    El globo en la fila del slot (y en las pestañas de la reunión) activa la búsqueda web para ese participante — funciona con proveedores que la admiten.
# Claud --- Довідка домашнього екрана ---
home_help_title = Acerca de la app
home_help_body = [b]Molfar System[/b] es un espacio donde varias IA conversan entre sí dentro de un proyecto, complementándose: cada participante tiene su propio modelo, rol y documentos, y el Orquestador dirige la discusión.

    Sitio del proyecto: [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref] — noticias, guías y prompts y skills adicionales para tus roles.

    [b]Reuniones (proyectos)[/b]
    Crea un proyecto y llena los slots: 1–4 — participantes, 5 — Orquestador (dirige rondas y resume), 6 — Secretario (mantiene la base de conocimiento y redacta el protocolo). Cada slot tiene su propio modelo, rol y documentos personales. Preguntas al Orquestador, la ronda se envía a todos y las respuestas se reúnen en pestañas.

    [b]Haiduk[/b]
    Un chat individual rápido con un solo modelo. Puede "vestirse" con cualquier rol con skill y prompt, acepta hasta 5 documentos y admite búsqueda web (donde el proveedor lo permite). "Limpiar chat" elimina solo mensajes; cambiar de rol es un reinicio completo, documentos incluidos.

    [b]Roles[/b]
    El rol define el comportamiento de la IA (prompt) y reglas concretas (skill). De fábrica — 23 roles: 17 participantes y 6 orquestadores. Crea los tuyos en el editor; en nuestro sitio hay prompts y skills listos para usar.

    [b]Memoria y documentos[/b]
    Cada slot ve solo sus propios documentos. Los archivos grandes los indexa el Secretario en la base de conocimiento y los sirve por fragmentos — las reuniones funcionan incluso con materiales voluminosos.

    [b]Exportaciones y protocolos[/b]
    Cualquier pestaña se exporta a un archivo de texto (carpeta Download/Molfar…), y el Secretario redacta a demanda un protocolo de la reunión con la lista de participantes y la cronología.

    [b]Primeros pasos[/b]
    Menú > "Configuración de IA" > introduce la clave API de al menos un proveedor. Las claves son gratuitas y se guardan solo en tu dispositivo.

# == MEETING QUEUE MODAL
queue_info = Aquí aparecerá un mensaje informativo

# == AI DISCLAIMER (Claud Fase 2.1 — consentimiento en el primer inicio)
disclaimer_title = Aviso importante
disclaimer_accept = Entendido
disclaimer_body = [b]Molfar System[/b] es una aplicación para reuniones con IA. Las respuestas y los resúmenes los generan modelos de inteligencia artificial de terceros (Google Gemini, NVIDIA, OpenRouter).

    [b]La IA puede equivocarse.[/b] Un modelo puede inventar un hecho, una fuente o una cifra y presentarlo con seguridad. Todos los resultados son solo informativos: verifica por tu cuenta lo importante.

    [b]Esto no es asesoramiento profesional.[/b] La aplicación no ofrece asesoramiento médico, psicológico, jurídico ni financiero. Los roles de los participantes (como «Psicólogo» o «Asesor de inversiones») son solo un estilo de respuesta del modelo, no el trabajo de un especialista.

    [b]Tus datos se quedan contigo.[/b] Los proyectos, historiales, roles y claves API se guardan solo en este dispositivo. Los textos de las consultas van directamente al proveedor de IA que elijas, según sus condiciones de uso.
# Claud Fase 2.2: microtexto permanente bajo las respuestas de IA/resumen.
ai_disclaimer_short = La IA puede equivocarse. Verifica los datos importantes.

# == AI NOTICE (Claud Fase 2.2 — bloque en la pestaña «Info»: aviso + queja)
info_ai_notice_title = Sobre las respuestas de IA
