# Claud --- Довідка екрана Налаштування ШІ ---
ai_settings_help_title = Ajustes de IA
ai_settings_help_body = [b]Aquí conectas los modelos de IA.[/b] Basta con un proveedor, pero con varios la reunión es más diversa.

    [b]1. Clave API[/b] — pega la clave en el campo y toca el icono del disquete. El proveedor se activa automáticamente y su catálogo de modelos queda disponible.

    [b]2. Interruptor[/b] (arriba a la derecha de la tarjeta) — activa/desactiva temporalmente el proveedor; la clave se conserva. Sin clave no se puede activar.

    [b]3. Modelos[/b] — la lista de modelos del proveedor: añade los tuyos ("+"), edita y activa cada uno por separado. Un modelo desactivado desaparece de los selectores en los chats.

    [b]4. Test[/b] — comprueba la conexión con el proveedor usando la clave actual.

    [b]Dónde conseguir claves gratuitas[/b]
    Google (Gemini): [ref=https://aistudio.google.com/apikey][color=4db6ac][u]aistudio.google.com/apikey[/u][/color][/ref] — "Create API key", se necesita una cuenta de Google.
    NVIDIA (NIM): [ref=https://build.nvidia.com][color=4db6ac][u]build.nvidia.com[/u][/color][/ref] — regístrate y luego "Get API Key" en la página de cualquier modelo.
    OpenRouter: [ref=https://openrouter.ai/keys][color=4db6ac][u]openrouter.ai/keys[/u][/color][/ref] — "Create Key"; los modelos marcados ":free" son gratis.

    Las claves se guardan localmente en este dispositivo en texto plano y solo se envían a los propios proveedores.
