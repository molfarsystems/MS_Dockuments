md_editor_help_prompt = [b]Qué es esto[/b]
    Estás editando el prompt de sistema del rol — el archivo prompt.md. El prompt define QUIÉN es el rol: profesión, carácter, estilo de respuesta. Ejemplo: "Eres un abogado experimentado, respondes formalmente y citas artículos de ley."

    [b]Cómo rellenarlo[/b]
    Escribe a mano o carga un texto listo con el icono de carpeta (solo .txt y .md — p. ej., prompts de nuestro sitio). La carga reemplaza el contenido del campo — con cambios sin guardar el editor preguntará antes.

    [b]Guardado[/b]
    "Guardar" escribe el texto en el prompt.md de este rol — el nombre del archivo de origen no importa. Límite de 5000 caracteres: al superarlo el contador se pone rojo y el guardado se bloquea hasta acortar. La cruz o "Atrás" con cambios sin guardar preguntarán: guardar, salir sin guardar o quedarse.

    [b]Consejo[/b]
    El prompt es "quién soy"; el skill, "cómo trabajo" (reglas y pasos concretos). No los dupliques.
md_editor_help_skill = [b]Qué es esto[/b]
    Estás editando el skill del rol — el archivo skill.md. Un skill son reglas, pasos y plantillas de trabajo concretos. Ejemplo: "Al redactar un contrato: 1) partes; 2) objeto; 3) condiciones; 4) responsabilidad."

    [b]Cómo rellenarlo[/b]
    A mano o desde un archivo con el icono de carpeta (solo .txt/.md). La carga reemplaza el contenido del campo — con cambios sin guardar el editor preguntará antes.

    [b]Guardado[/b]
    "Guardar" escribe en el skill.md del rol — el nombre del archivo de origen se ignora. Límite de 5000 caracteres: al superarlo el contador se pone rojo y el guardado se bloquea. La cruz o "Atrás" con cambios sin guardar preguntarán: guardar / no guardar / cancelar.

    [b]Para orquestadores[/b]
    El skill de un orquestador se apila SOBRE las reglas fijas del puesto de Orquestador — escribe solo complementos (estilo de conducción, criterios), no repitas la mecánica de rondas.
