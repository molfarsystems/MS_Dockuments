md_editor_help_prompt = [b]Worum es geht[/b]
    Sie bearbeiten den System-Prompt der Rolle — die Datei prompt.md. Der Prompt bestimmt, WER die Rolle ist: Beruf, Charakter, Antwortstil. Beispiel: "Du bist ein erfahrener Jurist, antwortest formell und zitierst Gesetzesartikel."

    [b]Ausfüllen[/b]
    Manuell tippen oder fertigen Text über das Ordner-Symbol laden (nur .txt und .md — z. B. Prompts von unserer Website). Laden ersetzt den Feldinhalt — bei ungespeicherten Änderungen fragt der Editor nach.

    [b]Speichern[/b]
    "Speichern" schreibt den Text in die prompt.md dieser Rolle — der Name der Quelldatei spielt keine Rolle. Limit 5000 Zeichen: darüber wird der Zähler rot und Speichern blockiert, bis Sie kürzen. Schließen oder "Zurück" bei ungespeicherten Änderungen fragt: speichern, ohne Speichern verlassen oder bleiben.

    [b]Tipp[/b]
    Prompt ist "wer ich bin", Skill ist "wie ich arbeite" (konkrete Regeln und Schritte). Nicht doppeln.
md_editor_help_skill = [b]Worum es geht[/b]
    Sie bearbeiten den Skill der Rolle — die Datei skill.md. Ein Skill sind konkrete Regeln, Schritte und Arbeitsvorlagen. Beispiel: "Beim Vertragsentwurf: 1) Parteien; 2) Gegenstand; 3) Bedingungen; 4) Haftung."

    [b]Ausfüllen[/b]
    Manuell oder aus einer Datei über das Ordner-Symbol (nur .txt/.md). Laden ersetzt den Feldinhalt — bei ungespeicherten Änderungen fragt der Editor nach.

    [b]Speichern[/b]
    "Speichern" schreibt in die skill.md der Rolle — der Name der Quelldatei wird ignoriert. Limit 5000 Zeichen: darüber wird der Zähler rot und Speichern blockiert. Schließen oder "Zurück" bei ungespeicherten Änderungen fragt: speichern / nicht speichern / abbrechen.

    [b]Für Orchestratoren[/b]
    Der Skill eines Orchestrators liegt ÜBER den festen Regeln des Orchestrator-Platzes — schreiben Sie nur Ergänzungen (Leitungsstil, Kriterien), nicht die Rundenmechanik.
