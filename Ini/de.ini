    Entwicklung: [b]Nova Hata[/b]
    Website: [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref]
    Datenschutzerklärung: [ref=https://molfar.nova-hata.com/privacy][color=4db6ac][u]molfar.nova-hata.com/privacy[/u][/color][/ref]
    Nutzungsbedingungen: [ref=https://molfar.nova-hata.com/terms-en][color=4db6ac][u]molfar.nova-hata.com/terms[/u][/color][/ref]

    [b]Datenschutz in Kürze[/b]
    Die App sammelt und sendet keine Daten. Projekte, Verläufe, Rollen und API-Schlüssel bleiben nur auf diesem Gerät; Anfragen gehen direkt an die gewählten KI-Anbieter.

    Fertige Prompts, Skills und Neuigkeiten — auf der Website.

