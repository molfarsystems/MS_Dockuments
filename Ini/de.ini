# == AI DISCLAIMER (Claud Phase 2.1 — Zustimmung beim ersten Start)
disclaimer_title = Wichtiger Hinweis
disclaimer_accept = Verstanden
disclaimer_body = [b]Molfar System[/b] ist eine App für KI-Besprechungen. Antworten und Zusammenfassungen werden von KI-Modellen Dritter erzeugt (Google Gemini, NVIDIA, OpenRouter).

    [b]KI kann sich irren.[/b] Ein Modell kann Fakten, Quellen oder Zahlen erfinden und überzeugend darstellen. Alle Ergebnisse dienen nur zur Information — prüfe Wichtiges selbst.

    [b]Dies ist keine professionelle Beratung.[/b] Die App bietet keine medizinische, psychologische, rechtliche oder finanzielle Beratung. Teilnehmerrollen (etwa „Psychologe" oder „Anlageberater") sind nur ein Antwortstil des Modells, nicht die Arbeit einer Fachperson.

    [b]Deine Daten bleiben bei dir.[/b] Projekte, Verläufe, Rollen und API-Schlüssel werden nur auf diesem Gerät gespeichert. Die Anfragetexte gehen direkt an den von dir gewählten KI-Anbieter gemäß dessen Nutzungsbedingungen.
