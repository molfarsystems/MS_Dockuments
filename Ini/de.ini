ai_settings_help_title = KI-Einstellungen
ai_settings_help_body = [b]Hier verbinden Sie KI-Modelle.[/b] Ein Anbieter genügt, mit mehreren wird die Besprechung vielfältiger.

    [b]1. API-Schlüssel[/b] — Schlüssel ins Feld einfügen und auf das Disketten-Symbol tippen. Der Anbieter wird automatisch aktiviert und sein Modellkatalog verfügbar.

    [b]2. Schalter[/b] (oben rechts auf der Karte) — aktiviert/deaktiviert den Anbieter vorübergehend; der Schlüssel bleibt gespeichert. Ohne Schlüssel lässt er sich nicht einschalten.

    [b]3. Modelle[/b] — die Modellliste des Anbieters: eigene hinzufügen ("+"), bearbeiten, jedes einzeln aktivieren. Ein deaktiviertes Modell verschwindet aus den Auswahlmenüs der Chats.

    [b]4. Test[/b] — prüft die Verbindung zum Anbieter mit dem aktuellen Schlüssel.

    [b]Kostenlose Schlüssel erhalten[/b]
    Google (Gemini): [ref=https://aistudio.google.com/apikey][color=4db6ac][u]aistudio.google.com/apikey[/u][/color][/ref] — "Create API key", ein Google-Konto ist nötig.
    NVIDIA (NIM): [ref=https://build.nvidia.com][color=4db6ac][u]build.nvidia.com[/u][/color][/ref] — registrieren, dann "Get API Key" auf einer beliebigen Modellseite.
    OpenRouter: [ref=https://openrouter.ai/keys][color=4db6ac][u]openrouter.ai/keys[/u][/color][/ref] — "Create Key"; Modelle mit ":free" sind gratis.

    Die Schlüssel werden lokal auf diesem Gerät im Klartext gespeichert und nur an die Anbieter selbst gesendet.
