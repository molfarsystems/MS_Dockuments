roles_add_help = Eine Rolle ist eine Spezialisten-Vorlage. Geben Sie Name, Beschreibung, Prompt (wer die Rolle ist und wie sie antwortet) und Skill (konkrete Regeln oder Schritte) ein. Tippen Sie auf den Block Prompt oder Skill, um den .md-Editor zu oeffnen.
roles_save_first = Speichern Sie zuerst Name und Beschreibung der Rolle, dann fügen Sie Prompt und Skill hinzu.
part_help = Auf diesem Bildschirm stellen Sie die Besprechungsrunde zusammen. Füllen Sie die Slots von oben nach unten und tippen Sie auf "Speichern".

    [b]Slots[/b]
    1–4 — Diskussionsteilnehmer, 5 — Orchestrator (führt Runden und fasst zusammen), 6 — Sekretär (verwaltet Projektdokumente und schreibt das Protokoll). Orchestrator plus ein Teilnehmer genügen für eine Besprechung.

    [b]Rolle[/b]
    Die Schaltfläche "Rolle" öffnet die Rollenliste — 23 ab Werk, eigene lassen sich im Rollen-Editor anlegen. Der Stift daneben ist die Schnellbearbeitung der gewählten Rolle. Teilnehmern passen Spezialistenrollen, dem Orchestrator führende Rollen (Moderator, Schiedsrichter, Analyst usw.).

    [b]Modell[/b]
    "Modell wählen" — eine Liste im Format "Anbieter · Modell" (G — Google, Nv — NVIDIA, OR — OpenRouter). Ein Modell kann nur einen Slot belegen; verfügbar sind nur Modelle aktivierter Anbieter mit Schlüssel.

    [b]Prompt[/b]
    Der Zähler zeigt die Größe des System-Prompts der Rolle. Antippen öffnet Ansicht und Bearbeitung — Änderungen gelten für diesen Slot.

    [b]Dok.[/b]
    Persönliche Dokumente des Teilnehmers: Antippen öffnet die Auswahl aus dem Projektpool (bis zu 5 Dateien pro Slot). Ein Teilnehmer sieht nur seine eigenen Dokumente; der Sekretär arbeitet automatisch mit dem gesamten Pool.

    [b]Bilder[/b]
    In Entwicklung.

    [b]Websuche[/b]
    Der Globus in der Slot-Zeile (und in den Besprechungs-Tabs) aktiviert die Websuche für diesen Teilnehmer — funktioniert bei Anbietern, die sie unterstützen.
# Claud --- Довідка домашнього екрана ---
home_help_title = Über die App
home_help_body = [b]Molfar System[/b] ist ein Raum, in dem mehrere KIs innerhalb eines Projekts miteinander sprechen und einander ergänzen: Jeder Teilnehmer hat sein eigenes Modell, seine Rolle und Dokumente, der Orchestrator leitet die Diskussion.

    Projekt-Website: [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref] — Neuigkeiten, Anleitungen sowie zusätzliche Prompts und Skills für Ihre Rollen.

    [b]Besprechungen (Projekte)[/b]
    Erstellen Sie ein Projekt und belegen Sie die Slots: 1–4 — Teilnehmer, 5 — Orchestrator (führt Runden und fasst zusammen), 6 — Sekretär (pflegt die Wissensbasis und schreibt das Protokoll). Jeder Slot erhält eigenes Modell, Rolle und persönliche Dokumente. Sie fragen den Orchestrator, die Runde geht an alle, Antworten sammeln sich in Tabs.

    [b]Haiduk[/b]
    Ein schneller Einzelchat mit einem Modell. Er lässt sich in jede Rolle mit Skill und Prompt "umkleiden", nimmt bis zu 5 Dokumente an und beherrscht Websuche (sofern der Anbieter sie unterstützt). "Chat leeren" entfernt nur Nachrichten; ein Rollenwechsel ist ein kompletter Reset inklusive Dokumente.

    [b]Rollen[/b]
    Eine Rolle bestimmt das Verhalten der KI (Prompt) und konkrete Regeln (Skill). Ab Werk — 23 Rollen: 17 Teilnehmer und 6 Orchestratoren. Eigene Rollen erstellen Sie im Editor; fertige Prompts und Skills finden Sie auf unserer Website.

    [b]Gedächtnis und Dokumente[/b]
    Jeder Slot sieht nur seine eigenen Dokumente. Große Dateien indexiert der Sekretär in die Wissensbasis und liefert sie als Fragmente — Besprechungen funktionieren auch mit umfangreichem Material.

    [b]Exporte und Protokolle[/b]
    Jeder Tab lässt sich als Textdatei exportieren (Ordner Download/Molfar…), und der Sekretär erstellt auf Befehl ein Besprechungsprotokoll mit Teilnehmerliste und Chronologie.

    [b]Erste Schritte[/b]
    Menü > "KI-Einstellungen" > API-Schlüssel mindestens eines Anbieters eintragen. Die Schlüssel sind kostenlos und bleiben nur auf Ihrem Gerät.

