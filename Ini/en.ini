ai_settings_help_title = AI Settings
ai_settings_help_body = [b]Here you connect AI models.[/b] One provider is enough, but with several the meeting gets more diverse.

    [b]1. API key[/b] — paste the key into the field and tap the diskette icon. The provider turns on automatically and its model catalog becomes available.

    [b]2. Switch[/b] (top right of the card) — temporarily enables/disables the provider; the key is kept. It cannot be enabled without a key.

    [b]3. Models[/b] — the provider's model list: add your own ("+"), edit, enable each one individually. A disabled model disappears from the pickers in chats.

    [b]4. Test[/b] — checks the connection to the provider with the current key.

    [b]Where to get free keys[/b]
    Google (Gemini): [ref=https://aistudio.google.com/apikey][color=4db6ac][u]aistudio.google.com/apikey[/u][/color][/ref] — "Create API key", a Google account is required.
    NVIDIA (NIM): [ref=https://build.nvidia.com][color=4db6ac][u]build.nvidia.com[/u][/color][/ref] — sign up, then "Get API Key" on any model page.
    OpenRouter: [ref=https://openrouter.ai/keys][color=4db6ac][u]openrouter.ai/keys[/u][/color][/ref] — "Create Key"; models marked ":free" cost nothing.

    Keys are stored locally on this device in plain text and are only sent to the providers themselves.
