roles_add_help = A role is a specialist template. Fill in the name, description, plus Prompt (who the role is and how it responds) and Skill (concrete rules or steps). Tap the Prompt or Skill block to open the .md editor.
roles_save_first = Save the role name and description first, then add the prompt and skill.
part_help = On this screen you assemble the meeting roster. Fill the slots top to bottom and tap "Save".

    [b]Slots[/b]
    1–4 — discussion participants, 5 — Orchestrator (runs rounds and summarizes the others), 6 — Secretary (handles project documents and writes the protocol). An Orchestrator plus one participant is enough for a meeting.

    [b]Role[/b]
    The "Role" button opens the role list — 23 out of the box, your own can be added in the role editor. The pencil next to it is a quick edit of the selected role. Specialist roles suit participants; leading roles (Moderator, Referee, Analyst etc.) suit the Orchestrator.

    [b]Model[/b]
    "Pick a model" — a list in "Provider · Model" format (G — Google, Nv — NVIDIA, OR — OpenRouter). One model can occupy only one slot; only models of enabled providers with a key are available.

    [b]Prompt[/b]
    The counter shows the size of the role's system prompt. Tap to view and edit — changes apply to this slot.

    [b]Docs[/b]
    The participant's personal documents: tap to pick from the project pool (up to 5 files per slot). A participant sees only its own documents; the Secretary automatically works with the whole pool.

    [b]Images[/b]
    In development.

    [b]Web search[/b]
    The globe in the slot row (and in meeting tabs) enables web search for that participant — works with providers that support it.
# Claud --- Довідка домашнього екрана ---
home_help_title = About the app
home_help_body = [b]Molfar System[/b] is a space where several AIs talk to each other within one project, complementing one another: every participant has its own model, role and documents, while the Orchestrator leads the discussion.

    Project website: [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref] — news, guides and extra prompts & skills for your roles.

    [b]Meetings (projects)[/b]
    Create a project and fill the slots: 1–4 — participants, 5 — Orchestrator (runs rounds and summarizes), 6 — Secretary (maintains the knowledge base and writes the protocol). Each slot gets its own model, role and personal documents. You ask the Orchestrator, the round is sent to everyone, answers are collected in tabs.

    [b]Haiduk[/b]
    A quick single chat with one model. It can be "dressed" into any role with a skill and prompt, accepts up to 5 documents and supports web search (where the provider allows). "Clear chat" removes messages only; changing the role is a full reset including documents.

    [b]Roles[/b]
    A role defines the AI's behavior (prompt) and concrete rules (skill). Out of the box — 23 roles: 17 participants and 6 orchestrators. Create your own in the editor; ready-made prompts and skills are available on our website.

    [b]Memory and documents[/b]
    Each slot sees only its own documents. Large files are indexed by the Secretary into the knowledge base and served as fragments — meetings work even with big materials.

    [b]Exports and protocols[/b]
    Any tab can be exported to a text file (Download/Molfar… folder), and the Secretary composes a meeting protocol with the roster and chronology on demand.

    [b]Getting started[/b]
    Menu > "AI Settings" > enter an API key for at least one provider. Keys are free and stored only on your device.

