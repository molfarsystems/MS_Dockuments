md_editor_help_prompt = [b]What this is[/b]
    You are editing the role's system prompt — the prompt.md file. The prompt defines WHO the role is: profession, character, answer style. Example: "You are an experienced lawyer, you answer formally and cite law articles."

    [b]How to fill it[/b]
    Type manually or load a ready text with the folder icon (.txt and .md only — e.g. prompts from our website). Loading replaces the field content — with unsaved changes the editor will ask first.

    [b]Saving[/b]
    "Save" writes the text into this role's prompt.md — the source file name does not matter. Limit 5000 characters: above it the counter turns red and saving is blocked until you shorten. The close button or "Back" with unsaved changes will ask: save, leave without saving, or stay.

    [b]Tip[/b]
    Prompt is "who I am", skill is "how I work" (concrete rules and steps). Don't duplicate one in the other.
md_editor_help_skill = [b]What this is[/b]
    You are editing the role's skill — the skill.md file. A skill is concrete rules, steps and work templates. Example: "When drafting a contract: 1) parties; 2) subject; 3) terms; 4) liability."

    [b]How to fill it[/b]
    Manually or from a file via the folder icon (.txt/.md only). Loading replaces the field content — with unsaved changes the editor will ask first.

    [b]Saving[/b]
    "Save" writes into the role's skill.md — the source file name is ignored. Limit 5000 characters: above it the counter turns red and saving is blocked. The close button or "Back" with unsaved changes will ask: save / don't save / cancel.

    [b]For orchestrators[/b]
    An orchestrator's skill is stacked ON TOP of the fixed Orchestrator-seat rules — write only additions (leading style, criteria), don't repeat the round mechanics.
