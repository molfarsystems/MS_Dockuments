# == AI DISCLAIMER (Claud Phase 2.1 — consent on first launch)
disclaimer_title = Important notice
disclaimer_accept = I understand
disclaimer_body = [b]Molfar System[/b] is an app for AI meetings. Replies and summaries are generated by third-party artificial intelligence models (Google Gemini, NVIDIA, OpenRouter).

    [b]AI can be wrong.[/b] A model may invent a fact, a source or a number and state it confidently. All results are for information only — verify anything important yourself.

    [b]This is not professional advice.[/b] The app does not provide medical, psychological, legal or financial advice. Participant roles (such as "Psychologist" or "Investment adviser") are only a response style of the model, not the work of a specialist.

    [b]Your data stays with you.[/b] Projects, histories, roles and API keys are stored only on this device. Request texts go directly to the AI provider you choose, under its terms of use.
# Claud Phase 2.2: persistent microcopy under AI replies/summary.
ai_disclaimer_short = AI can make mistakes. Verify important facts.

