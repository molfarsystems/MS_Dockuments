md_editor_help_prompt = [b]Що це[/b]
    Ви редагуєте системний промпт ролі — файл prompt.md. Промпт визначає, ХТО ця роль: фах, характер, стиль відповідей. Приклад: «Ти досвідчений юрист, відповідаєш формально, посилаєшся на статті законів.»

    [b]Як заповнити[/b]
    Пишіть вручну або завантажте готовий текст іконкою теки (лише .txt і .md — наприклад, промпти з нашого сайту). Завантаження замінює вміст поля — при незбережених змінах редактор перепитає.

    [b]Збереження[/b]
    «Зберегти» записує текст у prompt.md цієї ролі — назва вихідного файлу не має значення. Ліміт 5000 символів: понад — лічильник червоніє і збереження блокується, доки не скоротите. Хрестик чи «Назад» при незбережених змінах запитають: зберегти, вийти без збереження чи лишитись.

    [b]Порада[/b]
    Промпт — «хто я», скіл — «як я працюю» (конкретні правила і кроки). Не дублюйте одне в одному.
md_editor_help_skill = [b]Що це[/b]
    Ви редагуєте скіл ролі — файл skill.md. Скіл — конкретні правила, кроки й шаблони роботи. Приклад: «При складанні договору: 1) сторони; 2) предмет; 3) умови; 4) відповідальність.»

    [b]Як заповнити[/b]
    Вручну або з файлу іконкою теки (лише .txt/.md). Завантаження замінює вміст поля — при незбережених змінах редактор перепитає.

    [b]Збереження[/b]
    «Зберегти» записує у skill.md ролі — назва вихідного файлу ігнорується. Ліміт 5000 символів: понад — лічильник червоніє, збереження блокується. Хрестик чи «Назад» при незбережених змінах запитають: зберегти / не зберігати / скасувати.

    [b]Для оркестраторів[/b]
    Скіл оркестратора лягає ПОВЕРХ незмінних правил місця Оркестратора — пишіть лише доповнення (стиль ведення, критерії), не повторюйте механіку раундів.
