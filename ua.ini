# Claud --- Довідка екрана Налаштування ШІ ---
ai_settings_help_title = Налаштування ШІ
ai_settings_help_body = [b]Тут ви під'єднуєте AI-моделі.[/b] Достатньо одного провайдера, але з кількома нарада різноманітніша.

    [b]1. API-ключ[/b] — вставте ключ у поле і натисніть значок дискети. Провайдер увімкнеться автоматично, і йому стане доступний каталог моделей.

    [b]2. Перемикач[/b] (угорі праворуч картки) — тимчасово вмикає/вимикає провайдера; ключ при цьому зберігається. Без ключа увімкнути не можна.

    [b]3. Моделі[/b] — список моделей провайдера: додавання власних (кнопка «+»), редагування, вмикання кожної окремо. Вимкнена модель зникає з пікерів у чатах.

    [b]4. Тест[/b] — перевіряє з'єднання з провайдером за поточним ключем.

    [b]Де взяти безкоштовні ключі[/b]
    Google (Gemini): [ref=https://aistudio.google.com/apikey][color=4db6ac][u]aistudio.google.com/apikey[/u][/color][/ref] — кнопка «Create API key», потрібен акаунт Google.
    NVIDIA (NIM): [ref=https://build.nvidia.com][color=4db6ac][u]build.nvidia.com[/u][/color][/ref] — реєстрація, далі «Get API Key» на сторінці будь-якої моделі.
    OpenRouter: [ref=https://openrouter.ai/keys][color=4db6ac][u]openrouter.ai/keys[/u][/color][/ref] — «Create Key»; моделі з позначкою «:free» безплатні.

    Ключі зберігаються локально на цьому пристрої у відкритому вигляді й надсилаються лише самим провайдерам.
