roles_add_help = Роль — це шаблон спеціаліста. Заповніть назву, опис, а також Промпт (хто ця роль і як відповідає) та Скіл (конкретні правила чи кроки). Клік на блок Промпт або Скіл відкриває редактор .md файлу.
roles_save_first = Спершу збережіть назву й опис ролі, потім додавайте промпт і скіл.
part_help = На цьому екрані ви збираєте склад наради. Заповнюйте слоти зверху вниз і натисніть «Зберегти».

    [b]Слоти[/b]
    1–4 — учасники дискусії, 5 — Оркестратор (веде раунди й узагальнює відповіді решти), 6 — Секретар (обслуговує документи проєкту і складає протокол). Для наради достатньо Оркестратора та одного учасника.

    [b]Роль[/b]
    Кнопка «Роль» відкриває список ролей — з коробки їх 23, власні додаються в редакторі ролей. Олівець поруч — швидке редагування обраної ролі. Учасникам пасують ролі-спеціалісти, Оркестратору — ролі-ведучі (Модератор, Суддя, Аналітик тощо).

    [b]Модель[/b]
    «Виберіть модель» — список у форматі «Провайдер · Модель» (G — Google, Nv — NVIDIA, OR — OpenRouter). Одна модель може бути лише в одному слоті; доступні лише моделі увімкнених провайдерів з ключем.

    [b]Промпт[/b]
    Лічильник показує розмір системного промпта ролі. Тап відкриває перегляд і редагування — зміни діють для цього слота.

    [b]Докум.[/b]
    Персональні документи учасника: тап відкриває вибір із пулу проєкту (до 5 файлів на слот). Учасник бачить лише свої документи; Секретар автоматично працює з усім пулом.

    [b]Зображ.[/b]
    У розробці.

    [b]Веб-пошук[/b]
    Глобус у рядку слота (і в табах наради) вмикає веб-пошук для цього учасника — працює на провайдерах, що його підтримують.
# Claud --- Довідка домашнього екрана ---
home_help_title = Про застосунок
home_help_body = [b]Molfar System[/b] — простір, де кілька AI спілкуються між собою в межах одного проєкту, доповнюючи одне одного: кожен учасник має власну модель, роль і документи, а Оркестратор веде дискусію.

    Сайт проєкту: [ref=https://molfar.nova-hata.com][color=4db6ac][u]molfar.nova-hata.com[/u][/color][/ref] — новини, інструкції та додаткові промпти й скіли для ваших ролей.

    [b]Наради (проєкти)[/b]
    Створіть проєкт і заповніть слоти: 1–4 — учасники, 5 — Оркестратор (веде раунди й підсумовує), 6 — Секретар (веде базу знань і складає протокол). Кожному слоту — своя модель, роль і персональні документи. Питання ставите Оркестраторові, раунд розсилається всім, відповіді збираються в табах.

    [b]Гайдук[/b]
    Швидкий одиночний чат з однією моделлю. «Перевдягається» в будь-яку роль зі скілом і промптом, приймає до 5 документів і вміє веб-пошук (де провайдер підтримує). «Очистити чат» прибирає лише повідомлення; зміна ролі — повний перезапуск разом з документами.

    [b]Ролі[/b]
    Роль визначає поведінку AI (промпт) і конкретні правила (скіл). З коробки — 23 ролі: 17 учасників і 6 оркестраторів. Власні ролі створюються в редакторі; готові промпти та скіли можна взяти на нашому сайті й вставити у свою роль.

    [b]Пам'ять і документи[/b]
    Кожен слот бачить лише свої документи. Великі файли Секретар індексує в базу знань і подає фрагментами — наради працюють навіть з об'ємними матеріалами.

    [b]Експорти і протоколи[/b]
    Будь-який таб експортується в текстовий файл (тека Download/Molfar…), а Секретар за командою складає протокол наради зі складом учасників і хронологією.

    [b]Початок роботи[/b]
    Меню > «Налаштування ШІ» > внесіть API-ключ хоча б одного провайдера. Ключі безкоштовні й зберігаються лише на вашому пристрої.

